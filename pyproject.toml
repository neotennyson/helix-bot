[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "0.1.0"
description = "Paper-only Indian index futures research and execution simulator"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "streamlit>=1.32",
  "yfinance>=0.2.40"
]

[project.scripts]
helix-bot = "helix.cli:main"

[tool.setuptools]
py-modules = ["tokens"]

[tool.setuptools.packages.find]
include = ["helix*"]
